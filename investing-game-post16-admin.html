<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post-16 Investing Game Host</title><link rel="icon" href="/logo-circle.webp"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--mint:#eef8eb;--green:#71c558;--red:#e85d5d;--purple:#8c52ff;--ink:#1a1a1a;--muted:#66706a;--rule:#d7ead2}*{box-sizing:border-box}body{margin:0;background:var(--mint);font-family:Lexend,Arial;color:var(--ink)}main{width:min(1050px,100%);margin:auto;padding:25px 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top img{width:55px}.panel{background:#fff;border:1px solid var(--rule);border-radius:18px;padding:22px;margin:16px 0}h1{margin:0;font-size:28px}h2{margin:0 0 10px}.muted{color:var(--muted)}button{border:0;border-radius:10px;background:var(--purple);color:#fff;padding:12px 16px;font:600 14px Lexend;cursor:pointer;margin:4px}button:disabled{opacity:.45}.danger{background:var(--red)}.green{background:var(--green)}.hidden{display:none!important}.code{font-size:48px;letter-spacing:8px;text-align:center;color:var(--purple);font-weight:800}.question{font-size:25px;font-weight:600;margin:15px 0}.meta{display:flex;gap:10px;flex-wrap:wrap}.pill{background:var(--mint);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600}.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.player{background:var(--mint);padding:12px;border-radius:12px}.player strong{display:block}.wheel{width:230px;height:230px;border-radius:50%;margin:20px auto;background:conic-gradient(var(--green) 0 50%,var(--red) 50%);display:grid;place-items:center;font-size:24px;font-weight:800;border:10px solid white;outline:5px solid var(--ink);transition:transform 5s cubic-bezier(.12,.78,.18,1)}.wheel.green{transform:rotate(1440deg)}.wheel.red{transform:rotate(1620deg)}.controls{text-align:center}.error{color:#b42318}</style></head><body><main><header class="top"><div><img src="/logo-circle.webp" alt="Real Life Money"><h1>Post-16 Investing Game Host</h1><p class="muted">Create and control the classroom game.</p></div><div id="createArea"><button id="createBtn">Create new game</button><p class="error" id="createError"></p></div></header><section class="panel hidden" id="gamePanel"><div class="code" id="code"></div><p class="muted" style="text-align:center">Students join at <strong>/investing-game-post16.html</strong></p><div class="meta"><span class="pill" id="status"></span><span class="pill" id="section"></span></div><div class="controls" id="controls"></div><div class="hidden" id="question"><div class="question" id="questionText"></div><p class="muted" id="answerCount"></p></div><div class="hidden" id="decision"><h2>Bank or gamble results</h2><p>Students are choosing. Spin once all choices are in.</p><div class="wheel" id="wheel">50/50</div></div></section><section class="panel hidden" id="scores"><h2>Players</h2><div class="players" id="players"></div></section></main><script>
const API="https://us-central1-workshop-booking-system-b791e.cloudfunctions.net/post16Game";const token=new URLSearchParams(location.search).get("token");let gameId="",lastSpin=0;const $=id=>document.getElementById(id);const show=(id,on=true)=>$(id).classList.toggle("hidden",!on);async function call(action,body={}){const r=await fetch(`${API}?action=${action}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({gameId,token,...body})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}$("createBtn").onclick=async()=>{try{const d=await call("create",{gameId:""});gameId=d.gameId;history.replaceState(null,"",`?token=${encodeURIComponent(token||"")}&game=${gameId}`);show("createArea",false);show("gamePanel");show("scores");poll()}catch(e){$("createError").textContent=e.message}};const existing=new URLSearchParams(location.search).get("game");if(existing){gameId=existing.toUpperCase();show("createArea",false);show("gamePanel");show("scores");poll()}async function command(command){await call("admin",{command})}async function poll(){try{const r=await call("state");render(r)}catch(e){console.error(e)}setTimeout(poll,1200)}function render(s){$("code").textContent=s.gameId;$("status").textContent=s.status;$("section").textContent=s.status==="lobby"?"Waiting for players":s.status==="finished"?"Complete":`Session ${s.section+1} of 3: ${s.sectionNames[s.section]}`;$("players").innerHTML=s.players.map(p=>`<div class="player"><strong>${safe(p.name)}</strong><span>£${p.total}</span><br><small>${p.choice||"No choice yet"}</small></div>`).join("");$("controls").innerHTML=s.status==="lobby"?'<button class="green" data-command="start">Start game</button>':s.status==="question"?'<button data-command="nextQuestion">Next question</button>':s.status==="decision"?'<button class="danger" data-command="spin">Spin for everyone</button><button class="green" data-command="continue">Continue to next session</button>':s.status==="finished"?'<button data-command="reset">New game</button>':'';$("controls").querySelectorAll("button").forEach(b=>b.onclick=()=>command(b.dataset.command));show("question",s.status==="question");show("decision",s.status==="decision");if(s.currentQuestion)$("questionText").textContent=s.currentQuestion.question;$("answerCount").textContent=`Question ${s.questionIndex+1} of 4 · Answers submitted: ${s.players.filter(p=>p.answered).length}/${s.players.length}`;if(s.spin.id>lastSpin){lastSpin=s.spin.id;if(s.spin.result)animate(s.spin.result)}}function animate(result){const w=$("wheel");w.className="wheel "+result;w.textContent=result.toUpperCase()}function safe(v){return String(v).replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}</script></body></html>
